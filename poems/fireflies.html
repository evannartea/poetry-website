        <!-- Main -->

            <div class="left-side-poem">

                <!-- Poem -->
                <div class="poem-body">
                    <div>
                        <h2>Fireflies</h2>
                        <span>21 Nov, 2024</span>
                    </div>

                    <div>
                        <p>
                            Can you feel the tears<br>
                            of Gaia on your skin?<br>
                            Can you taste the cold<br>
                            from the sky's grieving sleep?<br>
                            Can you hear the mother's wounded words<br>
                            burning through the trees?<br>
                            But the fireflies will continue falling<br>
                            To embrace spring's passing bloom<br>
                        </p>
                    </div>
                </div>

            </div>

            <div class="right-side-poem">
                <!-- Image -->
                <a href="https://www.marchansonart.com/dataviewer.asp?keyvalue=1902&page=AllWorks">

                </a>
            </div>
        </main>
