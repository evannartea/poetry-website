                <div class="poem-body">
                    <div>
                        <h2>Lullaby</h2>
                        <span>05 Feb, 2026</span>
                    </div>

                    <div>
                        <p>
                            What's left lives on through whispers<br>
                            Under the light of the moon<br>
                            Softly now, slowly<br>
                            <br>
                            What was once skin and breath<br>
                            Faded into words from a lullaby<br>
                            Softly now, slowly
                        </p>
                    </div>
                </div>

            </div>
